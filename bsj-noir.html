<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BSJ — Film Noir</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050505;color:#d4af37;font-family:Georgia,serif}header{text-align:center;padding:50px 20px 30px;border-bottom:1px solid #1a1a1a}.logo{font-size:clamp(2rem,6vw,4rem);font-weight:900;letter-spacing:10px;color:#fff;text-shadow:2px 2px 0 #d4af37}.sub{font-size:.85rem;letter-spacing:5px;color:#d4af37;margin-top:8px;font-style:italic}.section{max-width:1200px;margin:50px auto;padding:0 20px}.section h2{font-size:1rem;letter-spacing:4px;color:#888;margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid #1a1a1a}.card{background:#0d0d0d;border:1px solid #222;padding:20px;margin-bottom:30px}.card h3{font-size:.8rem;letter-spacing:3px;color:#666;margin-bottom:12px}.wrap{width:100%;background:#000;display:flex;justify-content:center}.btn{display:inline-block;margin-top:14px;padding:10px 26px;background:#d4af37;color:#000;font-weight:700;font-size:.75rem;letter-spacing:3px;border:none;cursor:pointer}canvas{display:block;max-width:100%;height:auto}</style></head><body><header><div class="logo">BLACK SMOKE JAZZ</div><div class="sub">FILM NOIR — VISUAL KIT</div></header><div class="section"><h2>KANAL KAPAĞI — 2560 × 1440 PX</h2><div class="card"><h3>BANNER</h3><div class="wrap"><canvas id="c1" width="2560" height="1440" style="width:100%;max-height:420px"></canvas></div><button class="btn" onclick="dl('c1','bsj-noir-banner.png')">↓ PNG İNDİR</button></div></div><div class="section"><h2>PROFİL — 800 × 800 PX</h2><div class="card"><h3>AVATAR</h3><div class="wrap"><canvas id="c2" width="800" height="800" style="width:360px;height:360px"></canvas></div><button class="btn" onclick="dl('c2','bsj-noir-profil.png')">↓ PNG İNDİR</button></div></div><div class="section"><h2>THUMBNAIL SERİSİ — 1280 × 720 PX</h2><div class="card"><h3>EP01 — SHADOW &amp; LIGHT</h3><div class="wrap"><canvas id="c3" width="1280" height="720" style="width:100%;max-height:360px"></canvas></div><button class="btn" onclick="dl('c3','bsj-noir-ep01.png')">↓ PNG İNDİR</button></div><div class="card"><h3>EP02 — RAIN AT MIDNIGHT</h3><div class="wrap"><canvas id="c4" width="1280" height="720" style="width:100%;max-height:360px"></canvas></div><button class="btn" onclick="dl('c4','bsj-noir-ep02.png')">↓ PNG İNDİR</button></div><div class="card"><h3>EP03 — THE SMOKING ROOM</h3><div class="wrap"><canvas id="c5" width="1280" height="720" style="width:100%;max-height:360px"></canvas></div><button class="btn" onclick="dl('c5','bsj-noir-ep03.png')">↓ PNG İNDİR</button></div></div><script>function dl(id,name){var a=document.createElement('a');a.download=name;a.href=document.getElementById(id).toDataURL('image/png');a.click();}function spot(c,x,y,r,a){var g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(255,255,255,'+a+')');g.addColorStop(.5,'rgba(212,175,55,'+(a*.3)+')');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,c.canvas.width,c.canvas.height);}function deco(c,x,y,w,h){c.save();c.strokeStyle='#d4af37';c.lineWidth=4;c.strokeRect(x,y,w,h);c.lineWidth=1;c.strokeRect(x+12,y+12,w-24,h-24);for(var i=0;i<3;i++){c.beginPath();c.moveTo(x+20+i*8,y+20);c.lineTo(x+w-20-i*8,y+20);c.stroke();c.beginPath();c.moveTo(x+20+i*8,y+h-20);c.lineTo(x+w-20-i*8,y+h-20);c.stroke();}c.fillStyle='#d4af37';for(var k=0;k<4;k++){var cx=[x+20,x+w-20,x+20,x+w-20][k],cy=[y+20,y+20,y+h-20,y+h-20][k];c.beginPath();c.moveTo(cx,cy-8);c.lineTo(cx+8,cy);c.lineTo(cx,cy+8);c.lineTo(cx-8,cy);c.closePath();c.fill();}c.restore();}function rays(c,cx,cy,n,len){c.save();c.strokeStyle='rgba(212,175,55,.15)';c.lineWidth=1;for(var i=0;i<n;i++){var a=i*Math.PI*2/n;c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.cos(a)*len,cy+Math.sin(a)*len);c.stroke();}c.restore();}(function(){var cv=document.getElementById('c1'),c=cv.getContext('2d'),W=2560,H=1440;c.fillStyle='#000';c.fillRect(0,0,W,H);c.fillStyle='#080808';for(var i=0;i<W;i+=4){c.fillRect(i,0,2,H);}spot(c,W/2,H/2,1100,.35);rays(c,W/2,H/2,72,1500);deco(c,80,80,W-160,H-160);c.font='italic 80px Georgia';c.textAlign='center';c.fillStyle='#d4af37';c.fillText('— A FILM NOIR JAZZ EXPERIENCE —',W/2,300);c.font='bold 280px Georgia';c.fillStyle='#fff';c.fillText('BLACK SMOKE',W/2,H/2+30);c.font='bold 280px Georgia';c.fillStyle='#d4af37';c.fillText('JAZZ',W/2,H/2+280);c.font='italic 50px Georgia';c.fillStyle='#888';c.fillText('Where shadows speak louder than words',W/2,H-200);})();(function(){var cv=document.getElementById('c2'),c=cv.getContext('2d'),S=800;c.fillStyle='#000';c.fillRect(0,0,S,S);spot(c,S/2,S/2,400,.4);rays(c,S/2,S/2,36,500);c.strokeStyle='#d4af37';c.lineWidth=6;c.beginPath();c.arc(S/2,S/2,360,0,Math.PI*2);c.stroke();c.lineWidth=2;c.beginPath();c.arc(S/2,S/2,340,0,Math.PI*2);c.stroke();c.lineWidth=1;c.beginPath();c.arc(S/2,S/2,320,0,Math.PI*2);c.stroke();c.font='bold 200px Georgia';c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';c.fillText('BSJ',S/2,S/2-20);c.font='italic 28px Georgia';c.fillStyle='#d4af37';c.fillText('— FILM NOIR —',S/2,S/2+160);c.font='20px Georgia';c.fillStyle='#666';c.fillText('BLACK SMOKE JAZZ',S/2,S/2+200);})();(function(){var cv=document.getElementById('c3'),c=cv.getContext('2d'),W=1280,H=720;c.fillStyle='#000';c.fillRect(0,0,W,H);c.fillStyle='#0a0a0a';c.beginPath();c.moveTo(0,0);c.lineTo(W,H);c.lineTo(0,H);c.closePath();c.fill();spot(c,W/3,H/2,500,.45);rays(c,W/3,H/2,48,800);deco(c,30,30,W-60,H-60);c.font='italic 36px Georgia';c.textAlign='left';c.fillStyle='#d4af37';c.fillText('— EPISODE ONE —',W/2+40,180);c.font='bold 100px Georgia';c.fillStyle='#fff';c.fillText('SHADOW',W/2+40,290);c.fillText('& LIGHT',W/2+40,400);c.font='italic 28px Georgia';c.fillStyle='#888';c.fillText('Black Smoke Jazz · Vol. I',W/2+40,470);c.font='20px Georgia';c.fillStyle='#d4af37';c.fillText('S01 · E01',W/2+40,520);})();(function(){var cv=document.getElementById('c4'),c=cv.getContext('2d'),W=1280,H=720;c.fillStyle='#000';c.fillRect(0,0,W,H);for(var i=0;i<150;i++){var x=Math.random()*W,y=Math.random()*H,l=20+Math.random()*40;c.strokeStyle='rgba(212,175,55,'+(0.05+Math.random()*.15)+')';c.lineWidth=1;c.beginPath();c.moveTo(x,y);c.lineTo(x-8,y+l);c.stroke();}spot(c,W/2,H/2,400,.3);deco(c,30,30,W-60,H-60);c.font='italic 32px Georgia';c.textAlign='center';c.fillStyle='#d4af37';c.fillText('— EPISODE TWO —',W/2,200);c.font='bold 90px Georgia';c.fillStyle='#fff';c.fillText('RAIN AT',W/2,310);c.fillText('MIDNIGHT',W/2,410);c.font='italic 26px Georgia';c.fillStyle='#888';c.fillText('Black Smoke Jazz · Vol. II',W/2,470);})();(function(){var cv=document.getElementById('c5'),c=cv.getContext('2d'),W=1280,H=720;c.fillStyle='#000';c.fillRect(0,0,W,H);for(var k=0;k<6;k++){c.fillStyle='rgba(212,175,55,'+(0.04+k*.01)+')';c.beginPath();c.ellipse(W/2+(k-3)*100,H/2-50,300-k*30,80,0,0,Math.PI*2);c.fill();}spot(c,W/2,H-100,500,.4);deco(c,30,30,W-60,H-60);c.font='italic 32px Georgia';c.textAlign='center';c.fillStyle='#d4af37';c.fillText('— EPISODE THREE —',W/2,180);c.font='bold 90px Georgia';c.fillStyle='#fff';c.fillText('THE SMOKING',W/2,300);c.fillText('ROOM',W/2,400);c.font='italic 26px Georgia';c.fillStyle='#888';c.fillText('Black Smoke Jazz · Vol. III',W/2,470);})();</script></body></html>
