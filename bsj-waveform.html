<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BSJ — Waveform</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0306;color:#d4af37;font-family:Arial,sans-serif}header{text-align:center;padding:50px 20px 30px;border-bottom:1px solid #1f0a10}.logo{font-size:clamp(2rem,6vw,4rem);font-weight:900;letter-spacing:6px;background:linear-gradient(90deg,#8b1a2c,#d4af37,#8b1a2c);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.sub{font-size:.85rem;letter-spacing:4px;color:#8b1a2c;margin-top:8px}.section{max-width:1200px;margin:50px auto;padding:0 20px}.section h2{font-size:1rem;letter-spacing:3px;color:#666;margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid #1f0a10}.card{background:#100509;border:1px solid #2a0a14;border-radius:6px;padding:20px;margin-bottom:30px}.card h3{font-size:.8rem;letter-spacing:2px;color:#666;margin-bottom:12px}.wrap{width:100%;background:#000;border-radius:4px;display:flex;justify-content:center}.btn{display:inline-block;margin-top:14px;padding:10px 26px;background:linear-gradient(90deg,#8b1a2c,#d4af37);color:#000;font-weight:700;font-size:.75rem;letter-spacing:2px;border:none;border-radius:3px;cursor:pointer}canvas{display:block;max-width:100%;height:auto}</style></head><body><header><div class="logo">BLACK SMOKE JAZZ</div><div class="sub">WAVEFORM EDITION — VISUAL KIT</div></header><div class="section"><h2>KANAL KAPAĞI — 2560 × 1440 PX</h2><div class="card"><h3>BANNER</h3><div class="wrap"><canvas id="c1" width="2560" height="1440" style="width:100%;max-height:420px"></canvas></div><button class="btn" onclick="dl('c1','bsj-waveform-banner.png')">↓ PNG İNDİR</button></div></div><div class="section"><h2>PROFİL — 800 × 800 PX</h2><div class="card"><h3>AVATAR</h3><div class="wrap"><canvas id="c2" width="800" height="800" style="width:360px;height:360px"></canvas></div><button class="btn" onclick="dl('c2','bsj-waveform-profil.png')">↓ PNG İNDİR</button></div></div><div class="section"><h2>THUMBNAIL SERİSİ — 1280 × 720 PX</h2><div class="card"><h3>EP01 — FREQUENCY</h3><div class="wrap"><canvas id="c3" width="1280" height="720" style="width:100%;max-height:360px"></canvas></div><button class="btn" onclick="dl('c3','bsj-waveform-ep01.png')">↓ PNG İNDİR</button></div><div class="card"><h3>EP02 — RESONANCE</h3><div class="wrap"><canvas id="c4" width="1280" height="720" style="width:100%;max-height:360px"></canvas></div><button class="btn" onclick="dl('c4','bsj-waveform-ep02.png')">↓ PNG İNDİR</button></div><div class="card"><h3>EP03 — AMPLITUDE</h3><div class="wrap"><canvas id="c5" width="1280" height="720" style="width:100%;max-height:360px"></canvas></div><button class="btn" onclick="dl('c5','bsj-waveform-ep03.png')">↓ PNG İNDİR</button></div></div><script>function dl(id,name){var a=document.createElement('a');a.download=name;a.href=document.getElementById(id).toDataURL('image/png');a.click();}function wave(c,W,H,cy,amp,freq,col,lw){c.save();c.strokeStyle=col;c.lineWidth=lw;c.beginPath();for(var x=0;x<=W;x+=4){var y=cy+Math.sin(x*freq)*amp+Math.sin(x*freq*2.3)*amp*.4;if(x===0)c.moveTo(x,y);else c.lineTo(x,y);}c.stroke();c.restore();}function bars(c,W,H,cy,n,maxAmp,col){c.save();c.fillStyle=col;var bw=W/n;for(var i=0;i<n;i++){var h=Math.abs(Math.sin(i*.4))*maxAmp+Math.abs(Math.sin(i*.13))*maxAmp*.5+10;c.fillRect(i*bw+bw*.2,cy-h/2,bw*.6,h);}c.restore();}function gradBg(c,W,H){var g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0a0306');g.addColorStop(.5,'#1a0510');g.addColorStop(1,'#0a0306');c.fillStyle=g;c.fillRect(0,0,W,H);}(function(){var cv=document.getElementById('c1'),c=cv.getContext('2d'),W=2560,H=1440;gradBg(c,W,H);bars(c,W,H,H/2,200,400,'rgba(212,175,55,.08)');wave(c,W,H,H/2,250,.005,'rgba(139,26,44,.5)',6);wave(c,W,H,H/2,180,.008,'rgba(212,175,55,.7)',4);wave(c,W,H,H/2,120,.012,'rgba(255,248,220,.4)',3);wave(c,W,H,H/2+20,80,.02,'rgba(212,175,55,.3)',2);c.strokeStyle='rgba(212,175,55,.4)';c.lineWidth=4;c.strokeRect(60,60,W-120,H-120);c.strokeStyle='rgba(139,26,44,.4)';c.lineWidth=2;c.strokeRect(80,80,W-160,H-160);var gt=c.createLinearGradient(0,H/2-100,W,H/2+100);gt.addColorStop(0,'#8b1a2c');gt.addColorStop(.5,'#fff8dc');gt.addColorStop(1,'#8b1a2c');c.font='bold 230px Arial';c.textAlign='center';c.fillStyle=gt;c.fillText('BLACK SMOKE',W/2,H/2-40);c.fillText('JAZZ',W/2,H/2+220);c.font='50px Arial';c.fillStyle='#d4af37';c.fillText('WAVEFORM EDITION',W/2,H/2+330);c.font='40px Arial';c.fillStyle='rgba(212,175,55,.4)';c.fillText('GÖRSEL İLETİŞİM & FİLM TASARIMI YOUTUBE KANALI',W/2,H-160);})();(function(){var cv=document.getElementById('c2'),c=cv.getContext('2d'),S=800;c.fillStyle='#0a0306';c.fillRect(0,0,S,S);var g=c.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);g.addColorStop(0,'rgba(139,26,44,.4)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,S,S);bars(c,S,S,S/2,40,150,'rgba(212,175,55,.15)');wave(c,S,S,S/2,80,.025,'rgba(212,175,55,.6)',3);wave(c,S,S,S/2+10,50,.04,'rgba(139,26,44,.5)',2);c.strokeStyle='#d4af37';c.lineWidth=5;c.beginPath();c.arc(S/2,S/2,360,0,Math.PI*2);c.stroke();c.strokeStyle='rgba(139,26,44,.5)';c.lineWidth=2;c.beginPath();c.arc(S/2,S/2,340,0,Math.PI*2);c.stroke();var gp=c.createLinearGradient(S/2-150,S/2,S/2+150,S/2);gp.addColorStop(0,'#8b1a2c');gp.addColorStop(.5,'#fff8dc');gp.addColorStop(1,'#d4af37');c.font='bold 200px Arial';c.textAlign='center';c.textBaseline='middle';c.fillStyle=gp;c.fillText('BSJ',S/2,S/2-30);c.font='30px Arial';c.fillStyle='#d4af37';c.fillText('WAVEFORM',S/2,S/2+170);c.font='20px Arial';c.fillStyle='#666';c.fillText('BLACK SMOKE JAZZ',S/2,S/2+210);})();(function(){var cv=document.getElementById('c3'),c=cv.getContext('2d'),W=1280,H=720;gradBg(c,W,H);bars(c,W,H,H/2,80,200,'rgba(212,175,55,.2)');wave(c,W,H,H/2,140,.012,'rgba(139,26,44,.6)',4);wave(c,W,H,H/2,90,.02,'rgba(212,175,55,.7)',3);c.strokeStyle='rgba(212,175,55,.5)';c.lineWidth=2;c.strokeRect(20,20,W-40,H-40);var g3=c.createLinearGradient(0,0,W,0);g3.addColorStop(0,'#8b1a2c');g3.addColorStop(.5,'#fff8dc');g3.addColorStop(1,'#d4af37');c.font='bold 110px Arial';c.textAlign='center';c.fillStyle=g3;c.fillText('FREQUENCY',W/2,H/2);c.font='32px Arial';c.fillStyle='#d4af37';c.fillText('· EPISODE 01 ·',W/2,H/2+60);c.font='22px Arial';c.fillStyle='rgba(212,175,55,.5)';c.fillText('BLACK SMOKE JAZZ · WAVEFORM',W/2,H-60);})();(function(){var cv=document.getElementById('c4'),c=cv.getContext('2d'),W=1280,H=720;gradBg(c,W,H);for(var k=0;k<8;k++){var cy=H/2+(k-4)*35;wave(c,W,H,cy,40+k*8,.008+k*.001,'rgba(212,175,55,'+(.5-k*.04)+')',2);}wave(c,W,H,H/2,180,.01,'rgba(139,26,44,.7)',5);c.strokeStyle='rgba(212,175,55,.5)';c.lineWidth=2;c.strokeRect(20,20,W-40,H-40);var g4=c.createLinearGradient(0,0,W,0);g4.addColorStop(0,'#d4af37');g4.addColorStop(.5,'#fff8dc');g4.addColorStop(1,'#8b1a2c');c.font='bold 110px Arial';c.textAlign='center';c.fillStyle=g4;c.fillText('RESONANCE',W/2,H/2);c.font='32px Arial';c.fillStyle='#d4af37';c.fillText('· EPISODE 02 ·',W/2,H/2+60);c.font='22px Arial';c.fillStyle='rgba(212,175,55,.5)';c.fillText('BLACK SMOKE JAZZ · WAVEFORM',W/2,H-60);})();(function(){var cv=document.getElementById('c5'),c=cv.getContext('2d'),W=1280,H=720;gradBg(c,W,H);bars(c,W,H,H/2,120,300,'rgba(212,175,55,.18)');wave(c,W,H,H/2-100,80,.015,'rgba(139,26,44,.5)',3);wave(c,W,H,H/2+100,80,.015,'rgba(139,26,44,.5)',3);wave(c,W,H,H/2,200,.008,'rgba(212,175,55,.8)',5);c.strokeStyle='rgba(212,175,55,.5)';c.lineWidth=2;c.strokeRect(20,20,W-40,H-40);var g5=c.createLinearGradient(0,0,W,0);g5.addColorStop(0,'#8b1a2c');g5.addColorStop(.5,'#d4af37');g5.addColorStop(1,'#fff8dc');c.font='bold 110px Arial';c.textAlign='center';c.fillStyle=g5;c.fillText('AMPLITUDE',W/2,H/2);c.font='32px Arial';c.fillStyle='#d4af37';c.fillText('· EPISODE 03 ·',W/2,H/2+60);c.font='22px Arial';c.fillStyle='rgba(212,175,55,.5)';c.fillText('BLACK SMOKE JAZZ · WAVEFORM',W/2,H-60);})();</script></body></html>
