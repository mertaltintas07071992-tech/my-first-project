<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLACK SMOKE JAZZ — YouTube Channel</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Roboto,Arial,sans-serif;padding:30px 20px;min-height:100vh}
.container{max-width:1280px;margin:0 auto}
.section-label{font-size:.6rem;letter-spacing:6px;color:#c9a84c;margin-bottom:16px;font-family:Arial,sans-serif;opacity:.7}
.banner-card{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:8px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.banner-card canvas{display:block;width:100%;height:auto;background:#000}
</style></head>
<body>
<div class="container">
<div class="section-label">— CHANNEL BANNER —</div>
<div class="banner-card"><canvas id="banner" width="1280" height="350"></canvas></div>
</div>

<script>
const GOLD='#c9a84c',DARK='#1a1a1a',BG='#0a0a0a';

class Smoke{
  constructor(W,H,ox,oy){this.W=W;this.H=H;this.ox=ox;this.oy=oy;this.reset(true);}
  reset(spread){
    this.x=this.ox+(Math.random()-0.5)*16;
    this.y=this.oy+(spread?-Math.random()*this.H*0.5:0);
    this.vx=(Math.random()-0.5)*0.35;
    this.vy=-0.25-Math.random()*0.5;
    this.r=8+Math.random()*28;
    this.life=180+Math.random()*220;
    this.age=spread?Math.random()*this.life:0;
    this.ma=0.18+Math.random()*0.28;
    this.osc=Math.random()*Math.PI*2;
    this.osa=0.0015+Math.random()*0.003;
  }
  step(t){this.age++;this.osc+=0.022;this.x+=this.vx+Math.sin(this.osc+t*this.osa)*0.5;this.y+=this.vy;this.r+=0.25;this.vy*=0.997;}
  alive(){return this.age<this.life&&this.y>-50;}
  draw(c){
    const t=this.age/this.life,a=Math.sin(t*Math.PI)*this.ma;
    if(a<=0)return;
    const g=c.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r);
    g.addColorStop(0,'rgba(220,220,220,'+(a*0.65)+')');
    g.addColorStop(0.5,'rgba(170,170,170,'+(a*0.3)+')');
    g.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=g;c.beginPath();c.arc(this.x,this.y,this.r,0,Math.PI*2);c.fill();
  }
}

function drawWindowGrid(c,W,H,offX,gridW){
  c.save();c.strokeStyle='rgba(150,150,150,0.16)';c.lineWidth=1;
  const cols=8,colW=gridW/cols;
  for(let i=0;i<=cols;i++){const x=offX+i*colW;c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke();}
  const rows=5,rowH=H/rows;
  for(let i=0;i<=rows;i++){const y=i*rowH;c.beginPath();c.moveTo(offX,y);c.lineTo(offX+gridW,y);c.stroke();}
  c.restore();
}

function drawBokeh(c,W,H,seed){
  c.save();c.globalCompositeOperation='screen';
  for(let i=0;i<25;i++){
    const x=(Math.sin(seed*0.7+i*1.3)*0.5+0.5)*W;
    const y=(Math.cos(seed*0.5+i*0.9)*0.5+0.5)*H;
    const r=6+Math.sin(seed+i)*3+Math.random()*22;
    const a=0.06+Math.random()*0.18;
    const g=c.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'rgba(255,255,255,'+a+')');
    g.addColorStop(0.45,'rgba(220,220,220,'+(a*0.5)+')');
    g.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();
  }
  c.restore();
}

function drawNoirWoman(c,cx,cy,s){
  c.save();c.translate(cx,cy);c.scale(s,s);
  const skin=c.createLinearGradient(-150,0,150,0);
  skin.addColorStop(0,'#e2e2e2');skin.addColorStop(0.4,'#9c9c9c');
  skin.addColorStop(0.7,'#3a3a3a');skin.addColorStop(1,'#1a1a1a');

  // hair back
  c.fillStyle='#080808';
  c.beginPath();
  c.moveTo(-110,-160);
  c.bezierCurveTo(-180,-180,-200,-100,-180,-30);
  c.bezierCurveTo(-170,10,-160,40,-150,80);
  c.bezierCurveTo(-130,70,-115,40,-105,10);
  c.lineTo(105,10);
  c.bezierCurveTo(115,40,130,70,150,80);
  c.bezierCurveTo(160,40,170,10,180,-30);
  c.bezierCurveTo(200,-100,180,-180,110,-160);
  c.bezierCurveTo(80,-220,40,-235,0,-235);
  c.bezierCurveTo(-40,-235,-80,-220,-110,-160);
  c.closePath();c.fill();

  // face
  c.fillStyle=skin;
  c.beginPath();c.ellipse(0,-100,90,120,0,0,Math.PI*2);c.fill();
  c.save();c.globalCompositeOperation='multiply';
  const jaw=c.createLinearGradient(-30,0,90,0);
  jaw.addColorStop(0,'rgba(255,255,255,1)');jaw.addColorStop(1,'rgba(40,40,40,1)');
  c.fillStyle=jaw;c.beginPath();c.ellipse(0,-100,90,120,0,0,Math.PI*2);c.fill();c.restore();

  // hair front waves
  c.fillStyle='#0a0a0a';
  c.beginPath();
  c.moveTo(-95,-180);
  c.bezierCurveTo(-70,-200,-30,-210,10,-200);
  c.bezierCurveTo(40,-195,75,-180,95,-160);
  c.bezierCurveTo(85,-150,60,-145,30,-150);
  c.bezierCurveTo(-10,-160,-50,-160,-95,-150);c.closePath();c.fill();
  c.beginPath();c.moveTo(-100,-150);c.bezierCurveTo(-120,-100,-130,-40,-110,20);
  c.bezierCurveTo(-115,-30,-110,-90,-95,-130);c.closePath();c.fill();
  c.beginPath();c.moveTo(100,-150);c.bezierCurveTo(120,-100,130,-40,110,20);
  c.bezierCurveTo(115,-30,110,-90,95,-130);c.closePath();c.fill();

  // eyebrows
  c.strokeStyle='#0a0a0a';c.lineWidth=4;c.lineCap='round';
  c.beginPath();c.moveTo(-50,-128);c.quadraticCurveTo(-30,-138,-12,-130);c.stroke();
  c.beginPath();c.moveTo(12,-130);c.quadraticCurveTo(30,-138,50,-128);c.stroke();

  // eyes
  c.fillStyle='rgba(0,0,0,0.4)';
  c.beginPath();c.ellipse(-30,-110,16,7,0,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(30,-110,16,7,0,0,Math.PI*2);c.fill();
  c.fillStyle='#0a0a0a';
  c.beginPath();c.ellipse(-30,-110,9,4,0,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(30,-110,9,4,0,0,Math.PI*2);c.fill();
  c.strokeStyle='#0a0a0a';c.lineWidth=1.5;
  for(let i=-3;i<=3;i++){
    c.beginPath();c.moveTo(-30+i*4,-114);c.lineTo(-30+i*4,-119);c.stroke();
    c.beginPath();c.moveTo(30+i*4,-114);c.lineTo(30+i*4,-119);c.stroke();
  }

  // nose
  c.strokeStyle='rgba(0,0,0,0.3)';c.lineWidth=2;
  c.beginPath();c.moveTo(2,-95);c.quadraticCurveTo(8,-75,5,-60);c.stroke();
  c.fillStyle='rgba(0,0,0,0.2)';
  c.beginPath();c.ellipse(0,-58,6,3,0,0,Math.PI*2);c.fill();

  // lips
  c.fillStyle='#1a1a1a';
  c.beginPath();
  c.moveTo(-22,-32);c.quadraticCurveTo(-10,-42,0,-36);c.quadraticCurveTo(10,-42,22,-32);
  c.quadraticCurveTo(15,-22,0,-22);c.quadraticCurveTo(-15,-22,-22,-32);c.closePath();c.fill();
  c.fillStyle='rgba(255,255,255,0.18)';
  c.beginPath();c.ellipse(-12,-34,7,2,0,0,Math.PI*2);c.fill();

  // neck
  c.fillStyle=skin;
  c.beginPath();c.moveTo(-32,10);c.lineTo(-40,80);c.lineTo(40,80);c.lineTo(32,10);c.closePath();c.fill();
  c.save();c.globalCompositeOperation='multiply';
  const ns=c.createLinearGradient(-40,0,40,0);
  ns.addColorStop(0,'rgba(255,255,255,1)');ns.addColorStop(1,'rgba(60,60,60,1)');
  c.fillStyle=ns;c.beginPath();c.moveTo(-32,10);c.lineTo(-40,80);c.lineTo(40,80);c.lineTo(32,10);c.closePath();c.fill();c.restore();

  // shoulders
  c.fillStyle=skin;
  c.beginPath();
  c.moveTo(-180,80);c.bezierCurveTo(-140,75,-90,80,-40,80);c.lineTo(40,80);
  c.bezierCurveTo(90,80,140,75,180,80);c.lineTo(180,180);c.lineTo(-180,180);c.closePath();c.fill();
  c.save();c.globalCompositeOperation='multiply';
  const ss=c.createLinearGradient(-180,0,180,0);
  ss.addColorStop(0,'rgba(255,255,255,1)');ss.addColorStop(1,'rgba(30,30,30,1)');
  c.fillStyle=ss;
  c.beginPath();c.moveTo(-180,80);c.bezierCurveTo(-140,75,-90,80,-40,80);c.lineTo(40,80);
  c.bezierCurveTo(90,80,140,75,180,80);c.lineTo(180,180);c.lineTo(-180,180);c.closePath();c.fill();c.restore();

  // black dress V-neck
  c.fillStyle='#040404';
  c.beginPath();c.moveTo(-180,180);c.lineTo(180,180);c.lineTo(180,400);c.lineTo(-180,400);c.closePath();c.fill();
  c.beginPath();
  c.moveTo(-90,140);c.lineTo(0,200);c.lineTo(90,140);
  c.bezierCurveTo(120,150,150,165,180,175);c.lineTo(180,180);c.lineTo(-180,180);c.lineTo(-180,175);
  c.bezierCurveTo(-150,165,-120,150,-90,140);c.closePath();c.fill();

  // spaghetti straps
  c.strokeStyle='#040404';c.lineWidth=8;c.lineCap='round';
  c.beginPath();c.moveTo(-65,80);c.lineTo(-90,140);c.stroke();
  c.beginPath();c.moveTo(65,80);c.lineTo(90,140);c.stroke();

  // collarbone
  c.strokeStyle='rgba(0,0,0,0.2)';c.lineWidth=2;
  c.beginPath();c.moveTo(-70,110);c.quadraticCurveTo(-30,118,0,115);c.quadraticCurveTo(30,118,70,110);c.stroke();

  // LEFT HAND with cigarette (positioned left side of woman, raised)
  // hand silhouette
  c.fillStyle=skin;
  c.beginPath();
  c.moveTo(-140,80);c.lineTo(-170,30);c.lineTo(-200,-30);
  c.bezierCurveTo(-215,-50,-220,-30,-210,-10);
  c.bezierCurveTo(-200,15,-180,40,-160,70);c.lineTo(-140,90);c.closePath();c.fill();
  // fingers holding cigarette
  c.fillStyle='#9a9a9a';
  c.beginPath();c.ellipse(-205,-35,8,12,0.4,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(-195,-25,7,11,0.4,0,Math.PI*2);c.fill();
  // cigarette (white thin line)
  c.strokeStyle='#f5f5f5';c.lineWidth=3;c.lineCap='round';
  c.beginPath();c.moveTo(-220,-50);c.lineTo(-180,-15);c.stroke();
  // cigarette tip glow
  c.fillStyle='#ff6a3a';c.beginPath();c.arc(-220,-50,3.5,0,Math.PI*2);c.fill();
  c.fillStyle='rgba(255,180,100,0.5)';c.beginPath();c.arc(-220,-50,8,0,Math.PI*2);c.fill();
  c.restore();
}

function grain(c,W,H,density,alpha){
  c.save();c.globalCompositeOperation='overlay';
  for(let i=0;i<density;i++){
    const v=Math.random()*255|0;
    c.fillStyle='rgba('+v+','+v+','+v+','+(alpha*Math.random())+')';
    c.fillRect(Math.random()*W|0,Math.random()*H|0,1,1);
  }
  c.restore();
}

function vignette(c,W,H,s){
  const g=c.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.7);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,'+s+')');
  c.fillStyle=g;c.fillRect(0,0,W,H);
}

function keyLight(c,W,H){
  c.save();c.globalCompositeOperation='screen';
  const g=c.createRadialGradient(W*0.25,H*0.4,0,W*0.25,H*0.4,W*0.6);
  g.addColorStop(0,'rgba(255,255,255,0.16)');
  g.addColorStop(0.5,'rgba(200,200,200,0.05)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=g;c.fillRect(0,0,W,H);c.restore();
  c.save();c.globalCompositeOperation='multiply';
  const s=c.createLinearGradient(W*0.5,0,W,0);
  s.addColorStop(0,'rgba(255,255,255,1)');s.addColorStop(1,'rgba(35,35,35,1)');
  c.fillStyle=s;c.fillRect(0,0,W,H);c.restore();
}

class Banner{
  constructor(){
    this.cv=document.getElementById('banner');this.c=this.cv.getContext('2d');
    this.W=1280;this.H=350;this.t=0;this.smoke=[];
    // cigarette tip approximate position (in canvas coords, after woman scale)
    // woman cx=W*0.65 cy=H*0.7 scale=0.7 -> tip is at translate(-220,-50) scaled
    const wcx=this.W*0.65,wcy=this.H*0.7,sc=0.7;
    const ox=wcx-220*sc,oy=wcy-50*sc;
    for(let i=0;i<40;i++)this.smoke.push(new Smoke(this.W,this.H,ox,oy));
  }
  update(){
    const c=this.c,W=this.W,H=this.H;this.t++;
    c.fillStyle='#000';c.fillRect(0,0,W,H);
    const bg=c.createLinearGradient(0,0,W,0);
    bg.addColorStop(0,'#0a0a0a');bg.addColorStop(0.5,'#1a1a1a');bg.addColorStop(1,'#080808');
    c.fillStyle=bg;c.fillRect(0,0,W,H);
    drawWindowGrid(c,W,H,W*0.32,W*0.6);
    drawBokeh(c,W,H,this.t*0.01);
    drawNoirWoman(c,W*0.65,H*0.7,0.7);
    keyLight(c,W,H);
    for(let i=this.smoke.length-1;i>=0;i--){
      this.smoke[i].step(this.t);
      if(!this.smoke[i].alive())this.smoke[i].reset(false);
    }
    c.save();c.globalCompositeOperation='screen';
    for(const s of this.smoke)s.draw(c);
    c.restore();
    c.save();c.fillStyle=GOLD;c.font='900 italic 64px Georgia, serif';c.textAlign='left';c.textBaseline='middle';
    c.shadowColor='rgba(201,168,76,0.5)';c.shadowBlur=18;
    c.fillText('BLACK SMOKE',W*0.05,H*0.36);
    c.fillText('JAZZ',W*0.05,H*0.6);c.restore();
    c.save();c.strokeStyle=GOLD;c.globalAlpha=0.5;c.lineWidth=2;
    c.beginPath();c.moveTo(W*0.05,H*0.8);c.lineTo(W*0.3,H*0.8);c.stroke();c.restore();
    vignette(c,W,H,0.55);
    grain(c,W,H,Math.floor(W*H/700),0.18);
  }
}

const banner=new Banner();
function loop(){banner.update();requestAnimationFrame(loop);}
loop();
</script></body></html>
