<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BSJ — Complete Kit</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#c9a84c;font-family:Georgia,serif}header{text-align:center;padding:60px 20px 30px;border-bottom:1px solid #141414}.logo{font-size:clamp(2rem,6vw,3.6rem);font-weight:900;font-style:italic;letter-spacing:8px;color:#c9a84c;text-shadow:0 0 40px rgba(201,168,76,.25)}.section{max-width:1280px;margin:60px auto;padding:0 20px}.section h2{font-size:.6rem;letter-spacing:6px;color:#2a2a2a;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid #141414;font-weight:400;font-family:Arial,sans-serif}.card{background:#0d0d0d;border:1px solid #1a1a1a;padding:24px;margin-bottom:36px}.card h3{font-size:.55rem;letter-spacing:5px;color:#2a2a2a;margin-bottom:14px;font-weight:400;font-family:Arial,sans-serif}.wrap{width:100%;background:#000;display:flex;justify-content:center;align-items:center;border:1px solid #111;overflow:hidden}.wrap.tx{background-image:linear-gradient(45deg,#1a1a1a 25%,transparent 25%),linear-gradient(-45deg,#1a1a1a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#1a1a1a 75%),linear-gradient(-45deg,transparent 75%,#1a1a1a 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,10px 0;background-color:#0a0a0a}.btn{display:inline-flex;margin-top:18px;padding:13px 32px;background:transparent;border:1px solid #c9a84c;color:#c9a84c;font-weight:700;font-size:.7rem;letter-spacing:4px;cursor:pointer;font-family:Arial,sans-serif;transition:all .3s}.btn:hover{background:#c9a84c;color:#000;box-shadow:0 0 30px rgba(201,168,76,.4)}canvas{display:block;max-width:100%;height:auto}</style></head><body><header><div class="logo">BLACK SMOKE JAZZ</div></header><div class="section"><h2>BANNER — 2560 × 1440</h2><div class="card"><h3>CHANNEL ART</h3><div class="wrap"><canvas id="b" width="2560" height="1440" style="width:100%;max-height:480px"></canvas></div><button class="btn" onclick="dl('b','bsj-banner.png')">↓ DOWNLOAD PNG</button></div></div><div class="section"><h2>AVATAR — 800 × 800</h2><div class="card"><h3>PROFILE</h3><div class="wrap"><canvas id="p" width="800" height="800" style="width:400px;height:400px"></canvas></div><button class="btn" onclick="dl('p','bsj-avatar.png')">↓ DOWNLOAD PNG</button></div></div><div class="section"><h2>WATERMARK — 400 × 120 (TRANSPARENT)</h2><div class="card"><h3>OVERLAY</h3><div class="wrap tx"><canvas id="w" width="400" height="120" style="width:400px;height:120px"></canvas></div><button class="btn" onclick="dl('w','bsj-watermark.png')">↓ DOWNLOAD PNG</button></div></div>
<script>
const GOLD='#c9a84c',RED='#8b1a1a',BG='#0a0a0a';
function dl(id,name){const a=document.createElement('a');a.download=name;a.href=document.getElementById(id).toDataURL('image/png');a.click();}
class P{
  constructor(W,H){
    this.W=W;this.H=H;
    this.x=W*(0.5+Math.random()*0.5);
    this.y=H*(0.3+Math.random()*0.6);
    this.vx=-(0.3+Math.random()*0.8);
    this.vy=(Math.random()-0.5)*0.4;
    this.r=30+Math.random()*100;
    this.life=180+Math.random()*240;
    this.age=Math.random()*this.life;
    this.ma=0.18+Math.random()*0.35;
    this.col=Math.random()<0.7?GOLD:RED;
    this.osc=Math.random()*Math.PI*2;
  }
  step(){this.age++;this.osc+=0.025;this.x+=this.vx;this.y+=this.vy+Math.sin(this.osc)*0.4;this.r+=0.25;}
  alive(){return this.age<this.life&&this.x>-200;}
  draw(c){
    const t=this.age/this.life;const a=Math.sin(t*Math.PI)*this.ma;
    if(a<=0)return;
    const rgb=this.col===GOLD?'201,168,76':'139,26,26';
    const g=c.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r);
    g.addColorStop(0,'rgba('+rgb+','+(a*0.55)+')');
    g.addColorStop(0.45,'rgba('+rgb+','+(a*0.2)+')');
    g.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=g;c.beginPath();c.arc(this.x,this.y,this.r,0,Math.PI*2);c.fill();
  }
}
function godRays(c,W,H,cx,cy,n){
  c.save();c.globalCompositeOperation='screen';
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+(Math.random()-0.5)*1.0;
    const len=Math.max(W,H)*1.4;
    const w=(0.008+Math.random()*0.022);
    const op=0.05+Math.random()*0.12;
    c.fillStyle='rgba(201,168,76,'+op+')';
    c.beginPath();c.moveTo(cx,cy);
    c.lineTo(cx+Math.cos(a-w)*len,cy+Math.sin(a-w)*len);
    c.lineTo(cx+Math.cos(a+w)*len,cy+Math.sin(a+w)*len);
    c.closePath();c.fill();
  }
  c.restore();
}
function grain(c,W,H,density,alpha){
  c.save();c.globalCompositeOperation='overlay';
  for(let i=0;i<density;i++){
    const v=Math.random()*255|0;
    c.fillStyle='rgba('+v+','+v+','+v+','+(alpha*Math.random())+')';
    c.fillRect(Math.random()*W|0,Math.random()*H|0,1,1);
  }
  c.restore();
}
function vignette(c,W,H,s){
  const g=c.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.7);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,'+s+')');
  c.fillStyle=g;c.fillRect(0,0,W,H);
}
function filmStrip(c,W,H,col,bw){
  c.save();c.fillStyle=col;c.fillRect(0,0,bw,H);
  c.fillStyle=BG;
  const ph=H*0.085;const pad=bw*0.18;const inner=bw-pad*2;
  for(let y=H*0.06;y<H-ph;y+=ph*1.4){
    c.fillRect(pad,y,inner,ph*0.7);
  }
  c.fillStyle=GOLD;c.globalAlpha=0.4;c.fillRect(bw-2,0,2,H);
  c.restore();
}
function bgGrad(c,W,H){
  const g=c.createRadialGradient(W*0.7,H/2,0,W*0.7,H/2,Math.max(W,H)*0.7);
  g.addColorStop(0,'#120709');g.addColorStop(0.5,'#0a0a0a');g.addColorStop(1,'#000');
  c.fillStyle=g;c.fillRect(0,0,W,H);
}
function bsjMono(c,cx,cy,size,col){
  c.save();c.fillStyle=col;c.font='900 italic '+size+'px Georgia, serif';c.textAlign='center';c.textBaseline='middle';
  c.shadowColor='rgba(201,168,76,0.5)';c.shadowBlur=size*0.18;
  c.fillText('BSJ',cx,cy);
  c.restore();
}
class Banner{
  constructor(){
    this.cv=document.getElementById('b');this.c=this.cv.getContext('2d');
    this.W=2560;this.H=1440;this.t=0;this.particles=[];
    for(let i=0;i<180;i++)this.particles.push(new P(this.W,this.H));
  }
  update(){
    this.t++;
    const c=this.c,W=this.W,H=this.H;
    bgGrad(c,W,H);
    godRays(c,W,H,W*0.62,-H*0.1,10);
    for(let i=this.particles.length-1;i>=0;i--){
      this.particles[i].step();
      if(!this.particles[i].alive())this.particles[i]=new P(W,H);
    }
    c.save();c.globalCompositeOperation='screen';
    for(const p of this.particles)p.draw(c);
    c.restore();
    filmStrip(c,W,H,'#000',W*0.4);
    c.save();c.fillStyle=GOLD;c.font='900 italic 280px Georgia, serif';c.textAlign='center';c.textBaseline='middle';
    c.shadowColor='rgba(201,168,76,0.5)';c.shadowBlur=50;
    c.fillText('BLACK SMOKE',W*0.7,H*0.42);
    c.fillText('JAZZ',W*0.7,H*0.6);
    c.restore();
    c.save();c.strokeStyle=GOLD;c.lineWidth=3;c.globalAlpha=0.7;
    c.beginPath();c.moveTo(W*0.42,H*0.85);c.lineTo(W*0.96,H*0.85);c.stroke();c.restore();
    vignette(c,W,H,0.55);
    grain(c,W,H,Math.floor(W*H/700),0.18);
  }
}
class Avatar{
  constructor(){
    this.cv=document.getElementById('p');this.c=this.cv.getContext('2d');
    this.W=800;this.H=800;this.t=0;this.particles=[];
    for(let i=0;i<60;i++)this.particles.push(new P(this.W,this.H));
  }
  update(){
    this.t++;
    const c=this.c,W=this.W,H=this.H;
    c.fillStyle=BG;c.fillRect(0,0,W,H);
    const rg=c.createRadialGradient(W/2,H/2,0,W/2,H/2,W/2);
    rg.addColorStop(0,'rgba(139,26,26,0.18)');rg.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=rg;c.fillRect(0,0,W,H);
    for(let i=this.particles.length-1;i>=0;i--){
      this.particles[i].step();
      if(!this.particles[i].alive())this.particles[i]=new P(W,H);
    }
    c.save();c.globalCompositeOperation='screen';
    for(const p of this.particles)p.draw(c);
    c.restore();
    c.save();c.strokeStyle=GOLD;c.lineWidth=6;
    c.beginPath();c.arc(W/2,H/2,360,0,Math.PI*2);c.stroke();
    c.lineWidth=2;c.globalAlpha=0.45;
    c.beginPath();c.arc(W/2,H/2,338,0,Math.PI*2);c.stroke();
    c.restore();
    c.save();c.strokeStyle=RED;c.lineWidth=3;c.setLineDash([3,9]);
    c.beginPath();c.arc(W/2,H/2,378,0,Math.PI*2);c.stroke();
    c.restore();
    bsjMono(c,W/2,H/2,300,GOLD);
    vignette(c,W,H,0.5);
    grain(c,W,H,Math.floor(W*H/600),0.16);
  }
}
class Watermark{
  constructor(){
    this.cv=document.getElementById('w');this.c=this.cv.getContext('2d');
    this.W=400;this.H=120;
  }
  update(){
    const c=this.c,W=this.W,H=this.H;
    c.clearRect(0,0,W,H);
    c.save();c.globalAlpha=0.85;c.fillStyle=GOLD;
    c.font='900 italic 70px Georgia, serif';c.textAlign='left';c.textBaseline='middle';
    c.shadowColor='rgba(201,168,76,0.5)';c.shadowBlur=12;
    c.fillText('BSJ',16,H/2);
    c.restore();
    c.save();c.globalAlpha=0.55;c.strokeStyle=GOLD;c.lineWidth=1.5;
    c.beginPath();c.moveTo(155,H*0.25);c.lineTo(155,H*0.75);c.stroke();c.restore();
    c.save();c.globalAlpha=0.85;c.fillStyle=GOLD;
    c.font='600 italic 22px Georgia, serif';c.textAlign='left';c.textBaseline='middle';
    c.fillText('BLACK SMOKE',172,H*0.42);
    c.fillText('JAZZ',172,H*0.7);
    c.restore();
  }
}
const banner=new Banner(),avatar=new Avatar(),watermark=new Watermark();
function loop(){banner.update();avatar.update();watermark.update();requestAnimationFrame(loop);}
loop();
</script></body></html>
