<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BSJ — Smoke & Vinyl</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#c9a84c;font-family:Arial,sans-serif}header{text-align:center;padding:50px 20px 30px;border-bottom:1px solid #1a1a1a}.logo{font-size:clamp(2rem,6vw,4rem);font-weight:900;letter-spacing:8px;background:linear-gradient(135deg,#c9a84c,#fff8dc,#c9a84c);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.sub{font-size:.85rem;letter-spacing:4px;color:#8b6914;margin-top:6px}.section{max-width:1200px;margin:50px auto;padding:0 20px}.section h2{font-size:1rem;letter-spacing:3px;color:#555;margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid #1a1a1a}.card{background:#111;border:1px solid #1e1e1e;border-radius:6px;padding:20px;margin-bottom:30px}.card h3{font-size:.8rem;letter-spacing:2px;color:#555;margin-bottom:12px}.wrap{width:100%;overflow:hidden;border-radius:4px;display:flex;align-items:center;justify-content:center;background:#000}.btn{display:inline-block;margin-top:14px;padding:10px 24px;background:linear-gradient(135deg,#c9a84c,#8b6914);color:#000;font-weight:700;font-size:.75rem;letter-spacing:2px;border:none;border-radius:3px;cursor:pointer;text-decoration:none}canvas{display:block;max-width:100%;height:auto}</style></head><body><header><div class="logo">BLACK SMOKE JAZZ</div><div class="sub">SMOKE &amp; VINYL — VISUAL KIT</div></header><div class="section"><h2>KANAL KAPAĞI — 2560 × 1440 PX</h2><div class="card"><h3>BANNER</h3><div class="wrap"><canvas id="c1" width="2560" height="1440" style="width:100%;max-height:420px"></canvas></div><button class="btn" onclick="dl('c1','bsj-smoke-vinyl-banner.png')">↓ PNG İNDİR</button></div></div><div class="section"><h2>PROFİL FOTOĞRAFI — 800 × 800 PX</h2><div class="card"><h3>AVATAR</h3><div class="wrap"><canvas id="c2" width="800" height="800" style="width:360px;height:360px"></canvas></div><button class="btn" onclick="dl('c2','bsj-smoke-vinyl-profil.png')">↓ PNG İNDİR</button></div></div><div class="section"><h2>THUMBNAIL SERİSİ — 1280 × 720 PX</h2><div class="card"><h3>EP01</h3><div class="wrap"><canvas id="c3" width="1280" height="720" style="width:100%;max-height:360px"></canvas></div><button class="btn" onclick="dl('c3','bsj-smoke-vinyl-ep01.png')">↓ PNG İNDİR</button></div><div class="card"><h3>EP02</h3><div class="wrap"><canvas id="c4" width="1280" height="720" style="width:100%;max-height:360px"></canvas></div><button class="btn" onclick="dl('c4','bsj-smoke-vinyl-ep02.png')">↓ PNG İNDİR</button></div><div class="card"><h3>EP03</h3><div class="wrap"><canvas id="c5" width="1280" height="720" style="width:100%;max-height:360px"></canvas></div><button class="btn" onclick="dl('c5','bsj-smoke-vinyl-ep03.png')">↓ PNG İNDİR</button></div></div><script>function dl(id,name){var a=document.createElement('a');a.download=name;a.href=document.getElementById(id).toDataURL('image/png');a.click();}function smoke(ctx,x,y,r,alpha){ctx.save();var g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(201,168,76,'+alpha+')');g.addColorStop(0.4,'rgba(139,26,26,'+(alpha*.4)+')');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore();}function vinyl(ctx,cx,cy,r,gold){ctx.save();for(var i=0;i<18;i++){ctx.beginPath();ctx.arc(cx,cy,r-i*r/20,0,Math.PI*2);ctx.strokeStyle='rgba(201,168,76,'+(0.06-i*.003)+')';ctx.lineWidth=1;ctx.stroke();}ctx.beginPath();ctx.arc(cx,cy,r*.08,0,Math.PI*2);ctx.fillStyle=gold;ctx.fill();ctx.restore();}(function(){var cv=document.getElementById('c1'),c=cv.getContext('2d'),W=2560,H=1440;var bg=c.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#0a0a0a');bg.addColorStop(.5,'#0f0508');bg.addColorStop(1,'#0a0a0a');c.fillStyle=bg;c.fillRect(0,0,W,H);smoke(c,400,700,600,.18);smoke(c,1200,400,800,.12);smoke(c,2100,800,700,.15);smoke(c,800,200,400,.1);vinyl(c,300,H/2,320,'#c9a84c');vinyl(c,2260,H/2,280,'#8b1a1a');c.strokeStyle='#1a1a1a';c.lineWidth=1;for(var i=0;i<W;i+=80){c.beginPath();c.moveTo(i,0);c.lineTo(i,H);c.stroke();}for(var j=0;j<H;j+=80){c.beginPath();c.moveTo(0,j);c.lineTo(W,j);c.stroke();}c.strokeStyle='rgba(201,168,76,.3)';c.lineWidth=3;c.strokeRect(60,60,W-120,H-120);c.fillStyle='rgba(201,168,76,.06)';c.fillRect(60,60,W-120,H-120);var gr=c.createLinearGradient(0,0,W,0);gr.addColorStop(0,'#8b6914');gr.addColorStop(.5,'#fff8dc');gr.addColorStop(1,'#8b6914');c.font='bold 220px Arial';c.textAlign='center';c.fillStyle=gr;c.fillText('BLACK SMOKE',W/2,H/2-40);c.fillText('JAZZ',W/2,H/2+220);c.font='60px Arial';c.fillStyle='#8b1a1a';c.fillText('GÖRSEL İLETİŞİM & FİLM TASARIMI YOUTUBE KANALI',W/2,H/2+340);c.font='40px Arial';c.fillStyle='rgba(201,168,76,.4)';c.fillText('SMOKE & VINYL EDITION',W/2,H-120);})();(function(){var cv=document.getElementById('c2'),c=cv.getContext('2d'),S=800;c.fillStyle='#0a0a0a';c.fillRect(0,0,S,S);smoke(c,S/2,S/2,380,.25);smoke(c,200,200,200,.12);smoke(c,600,600,200,.12);vinyl(c,S/2,S/2,340,'#c9a84c');c.strokeStyle='#c9a84c';c.lineWidth=4;c.beginPath();c.arc(S/2,S/2,350,0,Math.PI*2);c.stroke();c.strokeStyle='rgba(201,168,76,.3)';c.lineWidth=2;c.beginPath();c.arc(S/2,S/2,370,0,Math.PI*2);c.stroke();var gp=c.createLinearGradient(S/2-120,S/2-80,S/2+120,S/2+80);gp.addColorStop(0,'#8b6914');gp.addColorStop(.5,'#fff8dc');gp.addColorStop(1,'#8b6914');c.font='bold 200px Arial';c.textAlign='center';c.textBaseline='middle';c.fillStyle=gp;c.fillText('BSJ',S/2,S/2);c.font='36px Arial';c.fillStyle='#8b1a1a';c.fillText('BLACK SMOKE JAZZ',S/2,S/2+200);})();(function(){var cv=document.getElementById('c3'),c=cv.getContext('2d'),W=1280,H=720;c.fillStyle='#0a0a0a';c.fillRect(0,0,W,H);c.fillStyle='#0f0205';c.fillRect(0,0,W/2,H);smoke(c,320,360,300,.3);smoke(c,900,360,250,.15);vinyl(c,320,H/2,260,'#c9a84c');c.strokeStyle='rgba(201,168,76,.2)';c.lineWidth=2;for(var i=0;i<W;i+=40){c.beginPath();c.moveTo(i,0);c.lineTo(i,H);c.stroke();}c.strokeStyle='#c9a84c';c.lineWidth=3;c.beginPath();c.moveTo(W/2,0);c.lineTo(W/2,H);c.stroke();var gt=c.createLinearGradient(W/2,0,W,0);gt.addColorStop(0,'#8b6914');gt.addColorStop(1,'#fff8dc');c.font='bold 90px Arial';c.textAlign='left';c.fillStyle=gt;c.fillText('EP 01',W/2+40,H/2-20);c.font='28px Arial';c.fillStyle='#8b1a1a';c.fillText('MIDNIGHT SAX SESSIONS',W/2+40,H/2+40);c.font='22px Arial';c.fillStyle='rgba(201,168,76,.5)';c.fillText('BLACK SMOKE JAZZ',W/2+40,H/2+90);c.strokeStyle='rgba(201,168,76,.3)';c.lineWidth=2;c.strokeRect(20,20,W-40,H-40);})();(function(){var cv=document.getElementById('c4'),c=cv.getContext('2d'),W=1280,H=720;c.fillStyle='#0a0a0a';c.fillRect(0,0,W,H);smoke(c,640,360,500,.2);smoke(c,200,100,300,.12);smoke(c,1100,600,300,.12);for(var i=0;i<40;i++){vinyl(c,Math.random()*W,Math.random()*H,20+Math.random()*40,'rgba(201,168,76,.1)');}vinyl(c,200,H/2,180,'#c9a84c');vinyl(c,1080,H/2,160,'#8b1a1a');c.font='bold 100px Arial';c.textAlign='center';var gg=c.createLinearGradient(0,0,W,0);gg.addColorStop(0,'#8b6914');gg.addColorStop(.5,'#fff8dc');gg.addColorStop(1,'#8b6914');c.fillStyle=gg;c.fillText('EP 02',W/2,H/2);c.font='30px Arial';c.fillStyle='#8b1a1a';c.fillText('LATE NIGHT BLUES',W/2,H/2+60);c.font='22px Arial';c.fillStyle='rgba(201,168,76,.5)';c.fillText('BLACK SMOKE JAZZ',W/2,H/2+110);c.strokeStyle='rgba(201,168,76,.4)';c.lineWidth=3;c.strokeRect(30,30,W-60,H-60);c.strokeStyle='rgba(201,168,76,.15)';c.lineWidth=1;c.strokeRect(50,50,W-100,H-100);})();(function(){var cv=document.getElementById('c5'),c=cv.getContext('2d'),W=1280,H=720;var bg=c.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0a0a0a');bg.addColorStop(.5,'#120306');bg.addColorStop(1,'#0a0a0a');c.fillStyle=bg;c.fillRect(0,0,W,H);smoke(c,W/2,H,600,.3);smoke(c,W/2,0,400,.15);c.strokeStyle='rgba(201,168,76,.08)';c.lineWidth=1;for(var r=50;r<700;r+=50){c.beginPath();c.arc(W/2,H/2,r,0,Math.PI*2);c.stroke();}vinyl(c,W/2,H/2,200,'#c9a84c');var gs=c.createLinearGradient(W/2,H/2-60,W/2,H/2+60);gs.addColorStop(0,'#fff8dc');gs.addColorStop(1,'#c9a84c');c.font='bold 100px Arial';c.textAlign='center';c.textBaseline='middle';c.fillStyle=gs;c.fillText('EP 03',W/2,H/2);c.font='28px Arial';c.fillStyle='#8b1a1a';c.textBaseline='alphabetic';c.fillText('SMOKE IN THE ROOM',W/2,H/2+120);c.font='20px Arial';c.fillStyle='rgba(201,168,76,.5)';c.fillText('BLACK SMOKE JAZZ',W/2,H/2+160);})();</script></body></html>
